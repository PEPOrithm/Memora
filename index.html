<style>
  html, body { margin: 0; padding: 0; background: #14152A; }
  #root { min-height: 100vh; }
  * { box-sizing: border-box; }
  .memora-display { font-family: 'Fraunces', serif; }
  .memora-mono { font-family: 'IBM Plex Mono', monospace; }
  .memora-btn { cursor: pointer; border: none; transition: transform .12s ease, opacity .15s ease, background .15s ease; font-family: inherit; }
  .memora-btn:hover { transform: translateY(-1px); }
  .memora-btn:active { transform: translateY(0); }
  .memora-input { font-family: inherit; }
  .memora-fade { animation: memoraFade .35s ease; }
  @keyframes memoraFade { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }
  .memora-flip { animation: memoraFlip .4s ease; }
  @keyframes memoraFlip { from { opacity: 0; transform: rotateX(8deg) scale(.98);} to { opacity: 1; transform: rotateX(0) scale(1);} }
  .memora-sand-grain {
    position: absolute; left: 50%; width: 3px; height: 3px; border-radius: 50%;
    transform: translateX(-50%); animation: memoraSandFall 0.85s linear infinite;
  }
  @keyframes memoraSandFall {
    0% { top: 0%; opacity: 0; }
    12% { opacity: 1; }
    82% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .memora-fade, .memora-flip { animation: none !important; } .memora-sand-grain { animation: none !important; opacity: 0 !important; } }
  .memora-scroll::-webkit-scrollbar { width: 8px; }
</style>

const todayISO = () => new Date().toISOString().slice(0, 10);
const addDays = (d, n) => { const dt = new Date(d); dt.setDate(dt.getDate() + n); return dt.toISOString().slice(0, 10); };
const isDue = (card) => card.dueDate <= todayISO();
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------------------------------------------------------------------------
// SM-2 — quality: 1 Again, 3 Hard, 4 Good, 5 Easy
// ---------------------------------------------------------------------------
function sm2(card, quality) {
  let { ease = 2.5, interval = 0, reps = 0, lapses = 0 } = card;
  if (quality < 3) { reps = 0; interval = 1; lapses += 1; }
  else {
    if (reps === 0) interval = 1;
    else if (reps === 1) interval = 6;
    else interval = Math.round(interval * ease);
    reps += 1;
  }
  ease = Math.max(1.3, Math.round((ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02))) * 100) / 100);
  return { ease, interval, reps, lapses, dueDate: addDays(todayISO(), interval), lastReviewed: todayISO() };
}
function grades(t) {
  return [
    { label: t.gradeAgain, quality: 1, key: "1" }, { label: t.gradeHard, quality: 3, key: "2" },
    { label: t.gradeGood, quality: 4, key: "3" }, { label: t.gradeEasy, quality: 5, key: "4" },
  ];
}

// ---------------------------------------------------------------------------
// Local persistence (localStorage — this is a standalone deployment, not a
// Claude artifact, so there is no window.storage API here)
// ---------------------------------------------------------------------------
const DATA_KEY = "memora-data";
const PROVIDER_KEY = "memora-ai-provider";
const KEY_PREFIX = "memora-api-key-";
const PROVIDERS = ["anthropic", "openai", "gemini"];
const DEFAULT_DATA = { decks: [], cards: [], reviewLog: [], theme: "light", lang: "ja", aiChat: [], pomodoro: { durationMin: 25, mode: "countdown" }, folders: [], notes: [] };

function loadData() {
  try {
    const raw = localStorage.getItem(DATA_KEY);
    return raw ? { ...DEFAULT_DATA, ...JSON.parse(raw) } : DEFAULT_DATA;
  } catch { return DEFAULT_DATA; }
}
function saveData(data) {
  try { localStorage.setItem(DATA_KEY, JSON.stringify(data)); } catch {}
}
function loadProvider() {
  try { return localStorage.getItem(PROVIDER_KEY) || "anthropic"; } catch { return "anthropic"; }
}
function saveProvider(p) {
  try { localStorage.setItem(PROVIDER_KEY, p); } catch {}
}
function loadApiKeys() {
  const out = {};
  PROVIDERS.forEach((p) => {
    try { out[p] = localStorage.getItem(KEY_PREFIX + p) || ""; } catch { out[p] = ""; }
  });
  return out;
}
function saveApiKey(provider, key) {
  try { localStorage.setItem(KEY_PREFIX + provider, key); } catch {}
}

// ---------------------------------------------------------------------------
// AI providers — direct browser calls using the user's own key.
// Internal neutral message shape: { role: "user"|"assistant", content: string | Array<
//   { type: "text", text } | { type: "image", mediaType, base64 }
// > }
// Anthropic and Gemini both allow direct browser calls (with the right headers).
// OpenAI's API does not send CORS headers for browser requests, so it will
// typically fail here — this is a known OpenAI limitation, not a bug in Memora.
// ---------------------------------------------------------------------------
async function askAnthropic(apiKey, messages, system) {
  const anthropicMessages = messages.map((m) => ({
    role: m.role,
    content: typeof m.content === "string" ? m.content : m.content.map((b) =>
      b.type === "text" ? { type: "text", text: b.text } : { type: "image", source: { type: "base64", media_type: b.mediaType, data: b.base64 } }
    ),
  }));
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model: "claude-sonnet-5", max_tokens: 1000, system, messages: anthropicMessages }),
    });
  } catch (e) { console.error("Memora network error", e); throw new Error("network"); }
  let json;
  try { json = await res.json(); } catch (e) { throw new Error("parse"); }
  if (!res.ok || json?.type === "error") { console.error("Memora API error", json); throw new Error(json?.error?.message || `http_${res.status}`); }
  const text = (json.content || []).map((b) => (b.type === "text" ? b.text : "")).join("\n").trim();
  if (!text) throw new Error("empty");
  return text;
}

async function askOpenAI(apiKey, messages, system) {
  const openaiMessages = [
    { role: "system", content: system },
    ...messages.map((m) => ({
      role: m.role,
      content: typeof m.content === "string" ? m.content : m.content.map((b) =>
        b.type === "text" ? { type: "text", text: b.text } : { type: "image_url", image_url: { url: `data:${b.mediaType};base64,${b.base64}` } }
      ),
    })),
  ];
  let res;
  try {
    res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
      body: JSON.stringify({ model: "gpt-5-mini", messages: openaiMessages }),
    });
  } catch (e) {
    console.error("Memora OpenAI network/CORS error", e);
    throw new Error("openai_cors");
  }
  let json;
  try { json = await res.json(); } catch (e) { throw new Error("parse"); }
  if (!res.ok || json?.error) { console.error("Memora OpenAI API error", json); throw new Error(json?.error?.message || `http_${res.status}`); }
  const text = json?.choices?.[0]?.message?.content?.trim();
  if (!text) throw new Error("empty");
  return text;
}

async function askGemini(apiKey, messages, system) {
  const contents = messages.map((m) => ({
    role: m.role === "assistant" ? "model" : "user",
    parts: typeof m.content === "string" ? [{ text: m.content }] : m.content.map((b) =>
      b.type === "text" ? { text: b.text } : { inline_data: { mime_type: b.mediaType, data: b.base64 } }
    ),
  }));
  let res;
  try {
    res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
      body: JSON.stringify({ contents, systemInstruction: { parts: [{ text: system }] } }),
    });
  } catch (e) { console.error("Memora Gemini network error", e); throw new Error("network"); }
  let json;
  try { json = await res.json(); } catch (e) { throw new Error("parse"); }
  if (!res.ok || json?.error) { console.error("Memora Gemini API error", json); throw new Error(json?.error?.message || `http_${res.status}`); }
  const text = (json?.candidates?.[0]?.content?.parts || []).map((p) => p.text || "").join("\n").trim();
  if (!text) throw new Error("empty");
  return text;
}

async function askAI(provider, apiKey, messages, system) {
  if (!apiKey) throw new Error("no_key");
  if (provider === "openai") return askOpenAI(apiKey, messages, system);
  if (provider === "gemini") return askGemini(apiKey, messages, system);
  return askAnthropic(apiKey, messages, system);
}

// ---------------------------------------------------------------------------
// Visual signature
// ---------------------------------------------------------------------------
function Lantern({ ease = 2.5, dueRatio = 0, size = 34, c }) {
  const strength = Math.max(0, Math.min(1, (ease - 1.3) / (2.8 - 1.3)));
  const glow = 6 + strength * 14;
  const core = dueRatio > 0 ? c.danger : c.gold;
  return (
    <div style={{ width: size, height: size, borderRadius: "50%", position: "relative", flexShrink: 0,
      background: `radial-gradient(circle at 35% 30%, ${core}, ${core}00 70%)`,
      boxShadow: `0 0 ${glow}px ${core}${dueRatio > 0 ? "aa" : "77"}`, border: `1px solid ${core}55` }}>
      {dueRatio > 0 && <div style={{ position: "absolute", inset: -4, borderRadius: "50%", border: `2px solid ${c.danger}`, opacity: .55 }} />}
    </div>
  );
}

function SimpleBarChart({ c, data }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 180 }}>
      {data.map((d, i) => (
        <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6, height: "100%", justifyContent: "flex-end" }}>
          <div title={String(d.value)} style={{
            width: "100%", maxWidth: 22, borderRadius: "4px 4px 0 0",
            height: `${(d.value / max) * 130}px`, minHeight: d.value > 0 ? 3 : 0,
            background: d.value > 0 ? c.teal : c.bgSunken, transition: "height .3s ease",
          }} />
          <span className="memora-mono" style={{ fontSize: 9.5, color: c.inkFaint }}>{d.label}</span>
        </div>
      ))}
    </div>
  );
}

// ---------------------------------------------------------------------------
// App
// ---------------------------------------------------------------------------
function Memora() {
  const [data, setDataState] = useState(loadData);
  const [aiProvider, setAiProvider] = useState(loadProvider);
  const [apiKeys, setApiKeys] = useState(loadApiKeys);
  const currentApiKey = apiKeys[aiProvider] || "";
  const [themeMode, setThemeMode] = useState(data.theme || "light");
  const [lang, setLang] = useState(data.lang || "ja");
  const [view, setView] = useState({ kind: "decks" });
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState(null);
  const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [desktopCollapsed, setDesktopCollapsed] = useState(false);
  const [aiOpen, setAiOpen] = useState(false);

  useEffect(() => {
    function onResize() { setIsMobile(window.innerWidth <= 768); }
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  useEffect(() => {
    if (!isMobile) return;
    let startX = null, startY = null, tracking = false;
    function onTouchStart(e) {
      const touch = e.touches[0];
      startX = touch.clientX; startY = touch.clientY;
      tracking = sidebarOpen || startX <= 24;
    }
    function onTouchMove(e) {
      if (!tracking || startX === null) return;
      const touch = e.touches[0];
      const dx = touch.clientX - startX, dy = touch.clientY - startY;
      if (Math.abs(dy) > Math.abs(dx)) return;
      if (!sidebarOpen && dx > 60) { setSidebarOpen(true); tracking = false; }
      if (sidebarOpen && dx < -60) { setSidebarOpen(false); tracking = false; }
    }
    function onTouchEnd() { startX = null; startY = null; tracking = false; }
    window.addEventListener("touchstart", onTouchStart, { passive: true });
    window.addEventListener("touchmove", onTouchMove, { passive: true });
    window.addEventListener("touchend", onTouchEnd, { passive: true });
    return () => {
      window.removeEventListener("touchstart", onTouchStart);
      window.removeEventListener("touchmove", onTouchMove);
      window.removeEventListener("touchend", onTouchEnd);
    };
  }, [isMobile, sidebarOpen]);

  const c = THEME[themeMode];
  const t = STRINGS[lang];

  function persist(next) { setDataState(next); saveData(next); }
  function showToast(msg) { setToast(msg); setTimeout(() => setToast(null), 2200); }

  const decks = data.decks, cards = data.cards;
  const dueCountForDeck = (id) => cards.filter((cd) => cd.deckId === id && isDue(cd)).length;
  const avgEaseForDeck = (id) => {
    const dc = cards.filter((cd) => cd.deckId === id);
    return dc.length ? dc.reduce((s, cd) => s + (cd.ease ?? 2.5), 0) / dc.length : 2.5;
  };

  function toggleTheme() { const n = themeMode === "light" ? "dark" : "light"; setThemeMode(n); persist({ ...data, theme: n }); }
  function toggleLang() { const n = lang === "ja" ? "en" : "ja"; setLang(n); persist({ ...data, lang: n }); }
  function navigate(next) { setView(next); if (isMobile) setSidebarOpen(false); }

  function createDeck(name, description) {
    const deck = { id: uid(), name: name.trim(), description: description.trim(), createdAt: todayISO() };
    persist({ ...data, decks: [...decks, deck] }); setModal(null); showToast(t.toastDeckCreated(deck.name));
  }
  function deleteDeck(deckId) {
    persist({ ...data, decks: decks.filter((d) => d.id !== deckId), cards: cards.filter((cd) => cd.deckId !== deckId) });
    setView({ kind: "decks" }); showToast(t.toastDeckDeleted);
  }
  function createCard(deckId, front, back) {
    const card = { id: uid(), deckId, front: front.trim(), back: back.trim(), ease: 2.5, interval: 0, reps: 0, lapses: 0, dueDate: todayISO(), createdAt: todayISO(), lastReviewed: null };
    persist({ ...data, cards: [...cards, card] }); setModal(null); showToast(t.toastCardAdded);
  }
  function createCardsBulk(deckId, list) {
    const newCards = list.map((it) => ({ id: uid(), deckId, front: it.front.trim(), back: it.back.trim(), ease: 2.5, interval: 0, reps: 0, lapses: 0, dueDate: todayISO(), createdAt: todayISO(), lastReviewed: null }));
    persist({ ...data, cards: [...cards, ...newCards] }); setModal(null); showToast(t.toastCardsAdded(newCards.length));
  }
  function updateCard(cardId, front, back) {
    persist({ ...data, cards: cards.map((cd) => cd.id === cardId ? { ...cd, front: front.trim(), back: back.trim() } : cd) });
    setModal(null); showToast(t.toastCardUpdated);
  }
  function deleteCard(cardId) { persist({ ...data, cards: cards.filter((cd) => cd.id !== cardId) }); showToast(t.toastCardDeleted); }
  function gradeCard(cardId, quality) {
    const card = cards.find((cd) => cd.id === cardId); if (!card) return;
    const updated = sm2(card, quality);
    const log = [...data.reviewLog, { date: todayISO(), quality }].slice(-2000);
    persist({ ...data, cards: cards.map((cd) => cd.id === cardId ? { ...cd, ...updated } : cd), reviewLog: log });
  }

  // --- Memo (folders + notes) ---
  const folders = data.folders || [];
  const notes = data.notes || [];
  function createFolder(name) {
    const folder = { id: uid(), name: name.trim(), createdAt: todayISO() };
    persist({ ...data, folders: [...folders, folder] });
    setModal(null);
    showToast(t.toastFolderCreated(folder.name));
  }
  function deleteFolder(folderId) {
    persist({ ...data, folders: folders.filter((f) => f.id !== folderId), notes: notes.filter((n) => n.folderId !== folderId) });
    setView({ kind: "memo" });
    showToast(t.toastFolderDeleted);
  }
  function createNote(folderId) {
    const note = { id: uid(), folderId, title: "", pages: [{ id: uid(), strokes: [] }], text: "", createdAt: todayISO(), updatedAt: todayISO() };
    persist({ ...data, notes: [...notes, note] });
    navigate({ kind: "memoNote", noteId: note.id, folderId });
  }
  function updateNote(noteId, patch) {
    persist({ ...data, notes: notes.map((n) => n.id === noteId ? { ...n, ...patch, updatedAt: todayISO() } : n) });
  }
  function deleteNote(noteId, folderId) {
    persist({ ...data, notes: notes.filter((n) => n.id !== noteId) });
    navigate({ kind: "memoFolder", folderId });
    showToast(t.toastNoteDeleted);
  }

  async function sendAiMessage(userText) {
    const history = [...(data.aiChat || []), { role: "user", content: userText }];
    persist({ ...data, aiChat: history.slice(-40) });
    if (!currentApiKey) {
      persist({ ...data, aiChat: [...history, { role: "assistant", content: t.aiNoKey }].slice(-40) });
      return;
    }
    try {
      const summary = decks.map((d) => `${d.name}(${t.dueBadge(dueCountForDeck(d.id))}, ${t.cardCount(cards.filter((cd) => cd.deckId === d.id).length)})`).join(", ") || (lang === "ja" ? "まだデッキがありません" : "no decks yet");
      const system = lang === "ja"
        ? `あなたはMemoraという間隔反復学習アプリに組み込まれたAI学習アシスタントです。親しみやすく簡潔な日本語で答えてください。ユーザーの現在のデッキ状況: ${summary}`
        : `You are the AI study assistant built into Memora, a spaced-repetition app. Answer concisely in English. User's current decks: ${summary}`;
      const reply = await askAI(aiProvider, currentApiKey, history.map((m) => ({ role: m.role, content: m.content })), system);
      persist({ ...data, aiChat: [...history, { role: "assistant", content: reply }].slice(-40) });
    } catch (err) {
      console.error("sendAiMessage failed", err);
      const msg = err?.message === "openai_cors" ? t.aiOpenAiCorsError : t.aiError;
      persist({ ...data, aiChat: [...history, { role: "assistant", content: msg }].slice(-40) });
    }
  }

  async function generateSuggestions(topic, count, onDone) {
    if (!currentApiKey) { onDone([], t.aiNoKey); return; }
    try {
      const langInstruction = lang === "ja" ? "日本語で" : "in English";
      const system = `You generate flashcards for a spaced-repetition app. Respond with ONLY a raw JSON array (no markdown fences, no commentary) of exactly ${count} objects, each with a "front" and "back" string field, written ${langInstruction}, about the given topic. Keep each field under 20 words.`;
      const reply = await askAI(aiProvider, currentApiKey, [{ role: "user", content: `Topic: ${topic}` }], system);
      const cleaned = reply.replace(/```json|```/g, "").trim();
      const match = cleaned.match(/\[[\s\S]*\]/);
      const list = JSON.parse(match ? match[0] : cleaned);
      const filtered = Array.isArray(list) ? list.filter((x) => x && x.front && x.back) : [];
      if (!filtered.length) throw new Error("no_valid_cards");
      onDone(filtered, null);
    } catch (err) {
      console.error("generateSuggestions failed", err);
      onDone([], err?.message === "openai_cors" ? t.aiOpenAiCorsError : t.suggestError);
    }
  }

  async function generateSuggestionsFromImage(base64Data, mediaType, count, onDone) {
    if (!currentApiKey) { onDone([], t.aiNoKey); return; }
    try {
      const langInstruction = lang === "ja" ? "日本語で" : "in English";
      const system = `You look at an image of study material (a textbook page, notes, a diagram, etc.) and generate flashcards for a spaced-repetition app based on its content. Respond with ONLY a raw JSON array (no markdown fences, no commentary) of up to ${count} objects, each with a "front" and "back" string field, written ${langInstruction}. Keep each field under 25 words. Base the cards only on what is actually visible in the image.`;
      const messages = [{
        role: "user",
        content: [
          { type: "image", mediaType, base64: base64Data },
          { type: "text", text: langInstruction === "日本語で" ? "この画像の内容からカードを作ってください。" : "Create flashcards from the content of this image." },
        ],
      }];
      const reply = await askAI(aiProvider, currentApiKey, messages, system);
      const cleaned = reply.replace(/```json|```/g, "").trim();
      const match = cleaned.match(/\[[\s\S]*\]/);
      const list = JSON.parse(match ? match[0] : cleaned);
      const filtered = Array.isArray(list) ? list.filter((x) => x && x.front && x.back) : [];
      if (!filtered.length) throw new Error("no_valid_cards");
      onDone(filtered, null);
    } catch (err) {
      console.error("generateSuggestionsFromImage failed", err);
      onDone([], err?.message === "openai_cors" ? t.aiOpenAiCorsError : t.suggestError);
    }
  }

  return (
    <div style={{ fontFamily: "'Inter', sans-serif", background: c.bg, color: c.ink, minHeight: "100vh", display: "flex" }}>
      <style>{`
        @media (max-width: 768px) {
          .memora-main { padding-top: calc(56px + env(safe-area-inset-top)) !important; }
          .memora-content { padding: 20px !important; }
        }
      `}</style>

      {isMobile && sidebarOpen && <div onClick={() => setSidebarOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.4)", zIndex: 55 }} />}
      {isMobile && (
        <div style={{ position: "fixed", top: 0, left: 0, right: 0, height: "calc(56px + env(safe-area-inset-top))", background: c.bgElevated, borderBottom: `1px solid ${c.border}`, display: "flex", alignItems: "center", gap: 12, padding: "env(safe-area-inset-top) 14px 0", boxSizing: "border-box", zIndex: 50 }}>
          <button className="memora-btn" onClick={() => setSidebarOpen(true)} style={{ background: "transparent", fontSize: 20, padding: 4 }}>☰</button>
          <span className="memora-display" style={{ fontSize: 17, fontWeight: 600, color: c.ink }}>Memora</span>
        </div>
      )}

      <Sidebar c={c} t={t} decks={decks} view={view} setView={navigate} themeMode={themeMode} toggleTheme={toggleTheme}
        lang={lang} toggleLang={toggleLang} onNewDeck={() => setModal({ type: "newDeck" })}
        dueCountForDeck={dueCountForDeck} avgEaseForDeck={avgEaseForDeck} isMobile={isMobile} sidebarOpen={sidebarOpen}
        collapsed={!isMobile && desktopCollapsed} onToggleCollapse={() => setDesktopCollapsed((v) => !v)}
        onOpenSettings={() => setModal({ type: "settings" })}
        onOpenTutorial={() => setModal({ type: "tutorial" })}
        onCloseMobile={() => setSidebarOpen(false)}
      />

      <main className="memora-main" style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
        <div className="memora-content" style={{ display: "flex", flexDirection: "column", flex: 1 }}>
          {view.kind === "decks" && (
            <DecksHome c={c} t={t} decks={decks} cards={cards} dueCountForDeck={dueCountForDeck} avgEaseForDeck={avgEaseForDeck}
              onOpenDeck={(id) => navigate({ kind: "deck", deckId: id })} onNewDeck={() => setModal({ type: "newDeck" })} />
          )}
          {view.kind === "deck" && (
            <DeckDetail c={c} t={t} deck={decks.find((d) => d.id === view.deckId)} cards={cards.filter((cd) => cd.deckId === view.deckId)}
              onBack={() => navigate({ kind: "decks" })} onStudy={() => navigate({ kind: "study", deckId: view.deckId })}
              onNewCard={() => setModal({ type: "newCard", deckId: view.deckId })}
              onSuggestCards={() => setModal({ type: "aiSuggest", deckId: view.deckId, loading: false, suggestions: null, error: null })}
              onSuggestImageCards={() => setModal({ type: "aiImageSuggest", deckId: view.deckId, loading: false, suggestions: null, error: null })}
              onEditCard={(card) => setModal({ type: "editCard", card })} onDeleteCard={deleteCard}
              onDeleteDeck={() => setModal({ type: "confirmDeleteDeck", deckId: view.deckId })} />
          )}
          {view.kind === "study" && (() => {
            const deckCards = cards.filter((cd) => cd.deckId === view.deckId);
            const dueCards = deckCards.filter(isDue);
            const initialQueue = dueCards.length > 0 ? dueCards : shuffleArray(deckCards);
            return (
              <StudySession c={c} t={t} deck={decks.find((d) => d.id === view.deckId)}
                queue={initialQueue} allCards={deckCards} onGrade={gradeCard}
                onExit={() => navigate({ kind: "deck", deckId: view.deckId })} />
            );
          })()}
          {view.kind === "stats" && <StatsView c={c} t={t} data={data} cards={cards} />}
          {view.kind === "pomodoro" && (
            <PomodoroView c={c} t={t} settings={data.pomodoro || { durationMin: 25, mode: "countdown" }}
              onUpdateSettings={(next) => persist({ ...data, pomodoro: next })} />
          )}
          {view.kind === "memo" && (
            <MemoFoldersHome c={c} t={t} folders={folders} notes={notes}
              onOpenFolder={(id) => navigate({ kind: "memoFolder", folderId: id })}
              onNewFolder={() => setModal({ type: "newFolder" })} />
          )}
          {view.kind === "memoFolder" && (
            <MemoFolderDetail c={c} t={t} folder={folders.find((f) => f.id === view.folderId)}
              notes={notes.filter((n) => n.folderId === view.folderId)}
              onBack={() => navigate({ kind: "memo" })}
              onNewNote={() => createNote(view.folderId)}
              onOpenNote={(id) => navigate({ kind: "memoNote", noteId: id, folderId: view.folderId })}
              onDeleteNote={(id) => { persist({ ...data, notes: notes.filter((n) => n.id !== id) }); showToast(t.toastNoteDeleted); }}
              onDeleteFolder={() => setModal({ type: "confirmDeleteFolder", folderId: view.folderId })} />
          )}
          {view.kind === "memoNote" && (
            <MemoNoteEditor key={view.noteId} c={c} t={t} note={notes.find((n) => n.id === view.noteId)}
              onBack={() => navigate({ kind: "memoFolder", folderId: view.folderId })}
              onUpdate={(patch) => updateNote(view.noteId, patch)}
              onDelete={() => deleteNote(view.noteId, view.folderId)} />
          )}
        </div>
      </main>

      <button className="memora-btn" onClick={() => setAiOpen(true)} title={t.aiConsult} style={{
        position: "fixed", bottom: 22, right: 22, width: 54, height: 54, borderRadius: "50%",
        background: `linear-gradient(145deg, ${c.gold}, ${c.teal})`, color: "#fff", fontSize: 22,
        display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 10px 26px rgba(0,0,0,.25)", zIndex: 45,
      }}>✨</button>

      {aiOpen && <AiPanel c={c} t={t} messages={data.aiChat || []} onSend={sendAiMessage} onClose={() => setAiOpen(false)} hasKey={!!currentApiKey} />}

      {modal?.type === "newDeck" && <DeckFormModal c={c} t={t} onCancel={() => setModal(null)} onSubmit={(n, d) => n.trim() && createDeck(n, d)} />}
      {modal?.type === "newCard" && <CardFormModal c={c} t={t} title={t.modalNewCardTitle} onCancel={() => setModal(null)} onSubmit={(f, b) => f.trim() && b.trim() && createCard(modal.deckId, f, b)} />}
      {modal?.type === "editCard" && <CardFormModal c={c} t={t} title={t.modalEditCardTitle} initialFront={modal.card.front} initialBack={modal.card.back} onCancel={() => setModal(null)} onSubmit={(f, b) => f.trim() && b.trim() && updateCard(modal.card.id, f, b)} />}
      {modal?.type === "confirmDeleteDeck" && <ConfirmModal c={c} title={t.confirmDeleteDeckTitle} body={t.confirmDeleteDeckBody} confirmLabel={t.confirmDeleteDeckBtn} cancelLabel={t.cancel} onCancel={() => setModal(null)} onConfirm={() => { deleteDeck(modal.deckId); setModal(null); }} />}
      {modal?.type === "aiSuggest" && (
        <AiSuggestModal c={c} t={t} onCancel={() => setModal(null)}
          onGenerate={(topic, count) => { setModal((m) => ({ ...m, loading: true, error: null })); generateSuggestions(topic, count, (list, err) => setModal((m) => ({ ...m, loading: false, suggestions: list, error: err }))); }}
          state={modal} onAddSelected={(sel) => createCardsBulk(modal.deckId, sel)} />
      )}
      {modal?.type === "aiImageSuggest" && (
        <AiImageSuggestModal c={c} t={t} onCancel={() => setModal(null)}
          onGenerate={(base64Data, mediaType, count) => { setModal((m) => ({ ...m, loading: true, error: null })); generateSuggestionsFromImage(base64Data, mediaType, count, (list, err) => setModal((m) => ({ ...m, loading: false, suggestions: list, error: err }))); }}
          state={modal} onAddSelected={(sel) => createCardsBulk(modal.deckId, sel)} />
      )}
      {modal?.type === "settings" && (
        <SettingsModal c={c} t={t} aiProvider={aiProvider} apiKeys={apiKeys}
          onCancel={() => setModal(null)}
          onSave={(provider, key) => {
            setAiProvider(provider); saveProvider(provider);
            setApiKeys((ks) => ({ ...ks, [provider]: key })); saveApiKey(provider, key);
            setModal(null); showToast(t.toastKeySaved);
          }} />
      )}
      {modal?.type === "tutorial" && <TutorialModal c={c} t={t} onCancel={() => setModal(null)} />}
      {modal?.type === "newFolder" && (
        <FolderFormModal c={c} t={t} onCancel={() => setModal(null)} onSubmit={(name) => name.trim() && createFolder(name)} />
      )}
      {modal?.type === "confirmDeleteFolder" && (
        <ConfirmModal c={c} title={t.confirmDeleteFolderTitle} body={t.confirmDeleteFolderBody} confirmLabel={t.confirmDeleteFolderBtn} cancelLabel={t.cancel}
          onCancel={() => setModal(null)} onConfirm={() => { deleteFolder(modal.folderId); setModal(null); }} />
      )}

      {toast && <div className="memora-fade" style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: c.ink, color: c.bg, padding: "10px 18px", borderRadius: 10, fontSize: 14, boxShadow: "0 8px 24px rgba(0,0,0,.25)", zIndex: 70 }}>{toast}</div>}
    </div>
  );
}

function Sidebar({ c, t, decks, view, setView, themeMode, toggleTheme, lang, toggleLang, onNewDeck, dueCountForDeck, avgEaseForDeck, isMobile, sidebarOpen, collapsed, onToggleCollapse, onOpenSettings, onOpenTutorial, onCloseMobile }) {

function StudySession({ c, t, deck, queue: initialQueue, allCards, onGrade, onExit }) {
  const [queue, setQueue] = useState(initialQueue.map((cd) => cd.id));
  const [revealed, setRevealed] = useState(false);
  const [doneCount, setDoneCount] = useState(0);
  const lookup = allCards || initialQueue;
  const currentId = queue[0];
  const current = lookup.find((cd) => cd.id === currentId);
  const G = grades(t);

  const handleGrade = useCallback((q) => { if (!currentId) return; onGrade(currentId, q); setDoneCount((n) => n + 1); setQueue((qq) => qq.slice(1)); setRevealed(false); }, [currentId, onGrade]);
  const restartPractice = useCallback(() => {
    setQueue(shuffleArray(allCards || initialQueue).map((cd) => cd.id));
    setDoneCount(0); setRevealed(false);
  }, [allCards, initialQueue]);

  useEffect(() => {
    function onKey(e) {
      if (!current) return;
      if (e.key === " " && !revealed) { e.preventDefault(); setRevealed(true); return; }
      if (revealed) { const g = G.find((g) => g.key === e.key); if (g) handleGrade(g.quality); }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [revealed, current, handleGrade]);

  if (!deck) return null;
  if (!current) {
    return (
      <div className="memora-fade" style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, padding: 40 }}>
        <div style={{ fontSize: 32 }}>✓</div>
        <div className="memora-display" style={{ fontSize: 24, fontWeight: 600 }}>{t.allCaughtUp}</div>
        <div style={{ color: c.inkSoft, fontSize: 14 }}>{t.reviewedSummary(doneCount, deck.name)}</div>
        <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
          {(allCards?.length ?? 0) > 0 && (
            <button className="memora-btn" onClick={restartPractice} style={{ background: "transparent", color: c.teal, border: `1.5px solid ${c.teal}`, borderRadius: 10, padding: "10px 20px", fontWeight: 600, fontSize: 14 }}>{t.studyAgainInSession}</button>
          )}
          <button className="memora-btn" onClick={onExit} style={{ background: c.teal, color: "#fff", borderRadius: 10, padding: "10px 20px", fontWeight: 600, fontSize: 14 }}>{t.backToDeck}</button>
        </div>
      </div>
    );
  }
  const progress = Math.round((doneCount / (doneCount + queue.length)) * 100);
  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", padding: "32px 24px 40px" }}>
      <div style={{ width: "100%", maxWidth: 640, display: "flex", alignItems: "center", gap: 12, marginBottom: 30 }}>
        <button className="memora-btn" onClick={onExit} style={{ background: "transparent", color: c.inkSoft, padding: 4, fontSize: 18 }}>✕</button>
        <div style={{ flex: 1, height: 6, background: c.bgSunken, borderRadius: 4, overflow: "hidden" }}><div style={{ height: "100%", width: `${progress}%`, background: c.teal, transition: "width .3s ease" }} /></div>
        <span className="memora-mono" style={{ fontSize: 12, color: c.inkFaint, minWidth: 50, textAlign: "right" }}>{t.leftCount(queue.length)}</span>
      </div>
      <div key={current.id} className="memora-flip" style={{ width: "100%", maxWidth: 640, minHeight: 280, background: c.bgElevated, border: `1px solid ${c.border}`, borderRadius: 20, padding: "40px 36px", display: "flex", flexDirection: "column", justifyContent: "center", gap: 20, boxShadow: "0 12px 32px rgba(0,0,0,.08)" }}>
        <div style={{ fontSize: 12, color: c.inkFaint, textTransform: "uppercase", letterSpacing: "0.06em" }}>{deck.name}</div>
        <div className="memora-display" style={{ fontSize: 24, fontWeight: 500, lineHeight: 1.4 }}>{current.front}</div>

// ---------------------------------------------------------------------------
// Pomodoro — an hourglass motif where the bottom mound of "sand" grows as
// time passes; a small mound at the top fades away as it drains down.
// ---------------------------------------------------------------------------
function PomodoroView({ c, t, settings, onUpdateSettings }) {
  const { durationMin, mode } = settings;
  const [remaining, setRemaining] = useState(durationMin * 60);
  const [elapsed, setElapsed] = useState(0);
  const [isRunning, setIsRunning] = useState(false);
  const [hasStarted, setHasStarted] = useState(false);
  const [showDurationPicker, setShowDurationPicker] = useState(false);

  useEffect(() => {
    setRemaining(durationMin * 60);
    setElapsed(0);
    setIsRunning(false);
    setHasStarted(false);
  }, [durationMin, mode]);

  useEffect(() => {
    if (!isRunning) return;
    const id = setInterval(() => {
      if (mode === "countdown") {
        setRemaining((r) => {
          if (r <= 1) { setIsRunning(false); return 0; }
          return r - 1;
        });
      } else {
        setElapsed((e) => e + 1);
      }
    }, 1000);
    return () => clearInterval(id);
  }, [isRunning, mode]);

  const totalSec = Math.max(1, durationMin * 60);
  const displaySec = mode === "countdown" ? remaining : elapsed;
  const mm = Math.floor(displaySec / 60);
  const ss = displaySec % 60;

  const elapsedFraction = mode === "countdown"
    ? Math.min(1, Math.max(0, 1 - remaining / totalSec))
    : Math.min(1, elapsed / totalSec);

  function togglePlay() {
    if (!isRunning) setHasStarted(true);
    setIsRunning((v) => !v);
  }
  function toggleMode() {
    onUpdateSettings({ ...settings, mode: mode === "countdown" ? "countup" : "countdown" });
  }
  function selectDuration(min) {
    onUpdateSettings({ ...settings, durationMin: min });
    setShowDurationPicker(false);
  }

  const p = hasStarted ? elapsedFraction : 0;
  const maxFillPct = 88;
  const pileHeight = p * maxFillPct;
  const bump = Math.min(6, pileHeight * 0.3);
  const moundPath = `M 0,100 L 100,100 L 100,${100 - pileHeight} Q 50,${100 - pileHeight - bump} 0,${100 - pileHeight} Z`;
  const showFall = hasStarted && isRunning && (mode !== "countdown" || remaining > 0) && pileHeight < maxFillPct - 1;

  return (
    <div className="memora-fade" style={{ position: "relative", flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 40, minHeight: 480, overflow: "hidden" }}>
      {[20, 35, 50, 65, 80].map((leftPct, i) => (
        <div key={leftPct} style={{
          position: "absolute", left: `${leftPct}%`, top: 0, bottom: `${pileHeight}%`,
          width: 3, transform: "translateX(-50%)", overflow: "visible", pointerEvents: "none",
          transition: "bottom .6s ease", zIndex: 0,
        }}>
          {showFall && [0, 1].map((j) => (
            <span key={j} className="memora-sand-grain" style={{ animationDelay: `${i * 0.18 + j * 0.5}s`, background: c.gold, opacity: 0.8 }} />
          ))}
        </div>
      ))}

      <svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" style={{ position: "absolute", inset: 0, zIndex: 0 }}>
        <defs>
          <linearGradient id="pomodoroSandGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={c.gold} stopOpacity="0.95" />
            <stop offset="100%" stopColor={c.gold} stopOpacity="0.7" />
          </linearGradient>
        </defs>
        <path d={moundPath} fill="url(#pomodoroSandGrad)" style={{ transition: "d .6s ease" }} />
      </svg>

      <div className="memora-mono" style={{
        position: "relative", zIndex: 1, width: 150, height: 150, borderRadius: "50%", border: `2px solid ${c.ink}`,
        display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: 34, fontWeight: 700, color: c.ink, background: c.bg,
        boxShadow: "0 4px 16px rgba(0,0,0,.1)",
      }}>
        {mm}:{String(ss).padStart(2, "0")}
      </div>

      <div style={{ position: "relative", zIndex: 1, display: "flex", alignItems: "center", gap: 24 }}>
        <button className="memora-btn" onClick={() => setShowDurationPicker(true)} title={t.pomodoroDurationTitle} style={{
          width: 46, height: 46, borderRadius: "50%", border: `1.5px solid ${c.border}`, background: c.bgElevated,
          color: c.ink, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 19,
        }}>⌛</button>
        <button className="memora-btn" onClick={togglePlay} style={{
          width: 68, height: 68, borderRadius: "50%", border: `2px solid ${c.ink}`, background: c.bg,
          color: c.ink, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24,
        }}>{isRunning ? "⏸" : "▶️"}</button>
        <button className="memora-btn" onClick={toggleMode} title={mode === "countdown" ? t.pomodoroCountupTitle : t.pomodoroCountdownTitle} style={{
          width: 46, height: 46, borderRadius: "50%", border: `1.5px solid ${c.border}`, background: c.bgElevated,
          color: c.ink, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18,
        }}>⇄</button>
      </div>

      {showDurationPicker && (
        <DurationPickerModal c={c} t={t} current={durationMin} onSelect={selectDuration} onClose={() => setShowDurationPicker(false)} />
      )}
    </div>
  );
}

function StatsView({ c, t, data, cards }) {
  const chartData = useMemo(() => {
    const days = []; for (let i = 13; i >= 0; i--) days.push(addDays(todayISO(), -i));
    return days.map((day) => ({ label: day.slice(5), value: data.reviewLog.filter((r) => r.date === day).length }));
  }, [data.reviewLog]);
  const totalReviews = data.reviewLog.length;
  const overallRetention = totalReviews ? Math.round((data.reviewLog.filter((r) => r.quality >= 3).length / totalReviews) * 100) : 0;
  const newCards = cards.filter((cd) => cd.reps === 0).length;
  const matureCards = cards.filter((cd) => cd.reps >= 2).length;
  const streak = useMemo(() => { let s = 0; for (let i = 0; i < 365; i++) { const day = addDays(todayISO(), -i); if (data.reviewLog.some((r) => r.date === day)) s++; else break; } return s; }, [data.reviewLog]);
  return (
    <div className="memora-fade" style={{ padding: "40px 48px", maxWidth: 980, width: "100%" }}>

        <StatCard c={c} icon="✓" label={t.retention} value={`${overallRetention}%`} />
        <StatCard c={c} icon="📖" label={t.newMatureCards} value={`${newCards} / ${matureCards}`} />

        <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 16 }}>{t.reviewsChartTitle}</div>

  );
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = () => reject(new Error("read_failed"));
    reader.readAsDataURL(file);
  });
}

const NOTE_PEN_COLORS = ["#1F2340", "#A8453B", "#2E7A6E", "#B9812E"];

function DrawingCanvas({ c, strokes, onAddStroke, tool, color, penWidth, pageHeight = 2000 }) {
  const canvasRef = useRef(null);
  const containerRef = useRef(null);
  const drawingRef = useRef(false);
  const currentPointsRef = useRef(null);

  const redrawAll = useCallback(() => {
    const canvas = canvasRef.current, container = containerRef.current;
    if (!canvas || !container) return;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, container.clientWidth, pageHeight);
    strokes.forEach((s) => drawStroke(ctx, s));
  }, [strokes, pageHeight]);

  function drawStroke(ctx, s) {
    if (!s.points || s.points.length < 2) return;
    ctx.globalCompositeOperation = s.erase ? "destination-out" : "source-over";
    ctx.strokeStyle = s.color; ctx.lineWidth = s.width; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(s.points[0].x, s.points[0].y);
    for (let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
    ctx.stroke();
    ctx.globalCompositeOperation = "source-over";
  }

  const resize = useCallback(() => {
    const canvas = canvasRef.current, container = containerRef.current;
    if (!canvas || !container) return;
    const dpr = window.devicePixelRatio || 1;
    const w = container.clientWidth, h = pageHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
    redrawAll();
  }, [redrawAll, pageHeight]);

  useEffect(() => { resize(); }, [resize]);
  useEffect(() => { redrawAll(); }, [redrawAll]);
  useEffect(() => {
    window.addEventListener("resize", resize);
    return () => window.removeEventListener("resize", resize);
  }, [resize]);

  function getPos(e) {
    const rect = canvasRef.current.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  // A bare finger touch is left alone so the page can still be scrolled;
  // only a stylus ("pen") or mouse actually draws — same convention GoodNotes uses.
  function isDrawingInput(e) { return e.pointerType === "pen" || e.pointerType === "mouse"; }
  function handleDown(e) {
    if (!isDrawingInput(e)) return;
    e.preventDefault();
    canvasRef.current.setPointerCapture?.(e.pointerId);
    drawingRef.current = true;
    currentPointsRef.current = [getPos(e)];
  }
  function handleMove(e) {
    if (!isDrawingInput(e) || !drawingRef.current) return;
    e.preventDefault();
    currentPointsRef.current.push(getPos(e));
    const ctx = canvasRef.current.getContext("2d");
    redrawAll();
    drawStroke(ctx, { points: currentPointsRef.current, color: tool === "eraser" ? "#000" : color, width: tool === "eraser" ? 20 : penWidth, erase: tool === "eraser" });
  }
  function handleUp(e) {
    if (!isDrawingInput(e) || !drawingRef.current) return;
    drawingRef.current = false;
    const pts = currentPointsRef.current;
    currentPointsRef.current = null;
    if (pts && pts.length > 1) {
      onAddStroke({ points: pts, color: tool === "eraser" ? "#000" : color, width: tool === "eraser" ? 20 : penWidth, erase: tool === "eraser" });
    }
  }

  return (
    <div ref={containerRef} style={{ width: "100%", height: pageHeight, touchAction: "pan-y" }}>
      <canvas ref={canvasRef} onPointerDown={handleDown} onPointerMove={handleMove} onPointerUp={handleUp} onPointerLeave={handleUp}
        style={{
          display: "block", width: "100%", height: pageHeight, cursor: "crosshair", touchAction: "pan-y",
          background: c.notePaper,
          backgroundImage: `repeating-linear-gradient(to bottom, transparent, transparent 34px, ${c.noteLine} 34px, ${c.noteLine} 35px)`,
        }} />
    </div>
  );
}

function MemoNoteEditor({ c, t, note, onBack, onUpdate, onDelete }) {
  const [tab, setTab] = useState("draw");
  const [tool, setTool] = useState("pen");
  const [color, setColor] = useState(NOTE_PEN_COLORS[0]);
  const [penWidth, setPenWidth] = useState(3);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [titleDraft, setTitleDraft] = useState(note?.title || "");
  const [pageIndex, setPageIndex] = useState(0);
  const textDebounceRef = useRef(null);

  useEffect(() => { setTitleDraft(note?.title || ""); }, [note?.id]);
  if (!note) return null;
  const pages = note.pages && note.pages.length ? note.pages : [{ id: "legacy", strokes: note.strokes || [] }];
  const clampedIndex = Math.min(pageIndex, pages.length - 1);
  const strokes = pages[clampedIndex]?.strokes || [];

  function commitTitle() { if (titleDraft !== note.title) onUpdate({ title: titleDraft }); }
  function updatePageStrokes(newStrokes) {
    const nextPages = pages.map((p, i) => (i === clampedIndex ? { ...p, strokes: newStrokes } : p));
    onUpdate({ pages: nextPages });
  }
  function handleAddStroke(stroke) { updatePageStrokes([...strokes, stroke]); }
  function handleUndo() { updatePageStrokes(strokes.slice(0, -1)); }
  function handleClear() { updatePageStrokes([]); }
  function handleAddPage() {
    const nextPages = [...pages, { id: uid(), strokes: [] }];
    onUpdate({ pages: nextPages });
    setPageIndex(nextPages.length - 1);
  }
  function handleTextChange(val) {
    if (textDebounceRef.current) clearTimeout(textDebounceRef.current);
    textDebounceRef.current = setTimeout(() => onUpdate({ text: val }), 300);
  }

  return (
    <div className="memora-fade" style={{ padding: "24px 32px 32px", maxWidth: 900, width: "100%", display: "flex", flexDirection: "column", flex: 1 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, gap: 12 }}>
        <button className="memora-btn" onClick={onBack} style={{ background: "transparent", color: c.inkSoft, display: "flex", alignItems: "center", gap: 6, fontSize: 13, padding: 0, flexShrink: 0 }}>‹ {t.backToFolders}</button>
        <input className="memora-input" value={titleDraft} onChange={(e) => setTitleDraft(e.target.value)} onBlur={commitTitle}
          onKeyDown={(e) => e.key === "Enter" && e.currentTarget.blur()} placeholder={t.noteTitlePlaceholder}
          style={{ flex: 1, background: "transparent", border: "none", fontSize: 19, fontWeight: 600, color: c.ink, padding: "4px 8px", textAlign: "center" }} />
        <button className="memora-btn" onClick={() => setConfirmDelete(true)} title={t.deleteNoteTooltip} style={{ background: "transparent", color: c.inkFaint, border: `1px solid ${c.border}`, borderRadius: 9, padding: 8, flexShrink: 0 }}>🗑️</button>
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        <button className="memora-btn" onClick={() => setTab("draw")} style={{ background: tab === "draw" ? c.bgSunken : "transparent", color: c.ink, border: `1px solid ${tab === "draw" ? c.border : "transparent"}`, borderRadius: 9, padding: "7px 14px", fontSize: 13, fontWeight: 600 }}>✎ {t.tabDraw}</button>
        <button className="memora-btn" onClick={() => setTab("text")} style={{ background: tab === "text" ? c.bgSunken : "transparent", color: c.ink, border: `1px solid ${tab === "text" ? c.border : "transparent"}`, borderRadius: 9, padding: "7px 14px", fontSize: 13, fontWeight: 600 }}>Aあ {t.tabText}</button>
      </div>

      {tab === "draw" ? (
        <>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10, flexWrap: "wrap" }}>
            <div style={{ display: "flex", gap: 6 }}>
              {NOTE_PEN_COLORS.map((col) => (
                <button key={col} className="memora-btn" onClick={() => { setTool("pen"); setColor(col); }} style={{ width: 26, height: 26, borderRadius: "50%", background: col, border: tool === "pen" && color === col ? `2px solid ${c.ink}` : `2px solid transparent`, boxShadow: `0 0 0 1px ${c.border}` }} />
              ))}
            </div>
            <div style={{ display: "flex", gap: 4 }}>
              {[2, 4, 7].map((w) => (
                <button key={w} className="memora-btn" onClick={() => { setTool("pen"); setPenWidth(w); }} style={{ width: 30, height: 30, borderRadius: 8, background: tool === "pen" && penWidth === w ? c.bgSunken : "transparent", border: `1px solid ${c.border}`, display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <span style={{ width: w + 2, height: w + 2, borderRadius: "50%", background: c.ink }} />
                </button>
              ))}
            </div>
            <button className="memora-btn" onClick={() => setTool("eraser")} title={t.toolEraser} style={{ background: tool === "eraser" ? c.bgSunken : "transparent", border: `1px solid ${c.border}`, borderRadius: 8, padding: 7, color: c.ink, fontSize: 15 }}>🧹</button>
            <div style={{ flex: 1 }} />
            <button className="memora-btn" onClick={handleUndo} title={t.toolUndo} disabled={strokes.length === 0} style={{ background: "transparent", border: `1px solid ${c.border}`, borderRadius: 8, padding: 7, color: c.ink, opacity: strokes.length === 0 ? 0.4 : 1, fontSize: 15 }}>↶</button>
            <button className="memora-btn" onClick={handleClear} title={t.toolClear} disabled={strokes.length === 0} style={{ background: "transparent", border: `1px solid ${c.border}`, borderRadius: 8, padding: "7px 10px", color: c.danger, fontSize: 12.5, fontWeight: 600, opacity: strokes.length === 0 ? 0.4 : 1 }}>{t.toolClear}</button>
          </div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 14, marginBottom: 10 }}>
            <button className="memora-btn" onClick={() => setPageIndex((i) => Math.max(0, i - 1))} disabled={clampedIndex === 0} style={{ background: "transparent", border: `1px solid ${c.border}`, borderRadius: 8, padding: "5px 9px", color: c.ink, opacity: clampedIndex === 0 ? 0.35 : 1, fontSize: 14 }}>‹</button>
            <span className="memora-mono" style={{ fontSize: 12.5, color: c.inkSoft }}>{t.pageIndicator(clampedIndex + 1, pages.length)}</span>
            <button className="memora-btn" onClick={() => setPageIndex((i) => Math.min(pages.length - 1, i + 1))} disabled={clampedIndex === pages.length - 1} style={{ background: "transparent", border: `1px solid ${c.border}`, borderRadius: 8, padding: "5px 9px", color: c.ink, opacity: clampedIndex === pages.length - 1 ? 0.35 : 1, fontSize: 14 }}>›</button>
            <button className="memora-btn" onClick={handleAddPage} title={t.addPageTooltip} style={{ background: "transparent", border: `1px solid ${c.border}`, borderRadius: 8, padding: "5px 10px", color: c.teal, fontSize: 12.5, fontWeight: 600 }}>＋ {t.addPageBtn}</button>
          </div>
          <div style={{ flex: 1, minHeight: 380, border: `1px solid ${c.border}`, borderRadius: 14, overflowY: "auto", overflowX: "hidden", overscrollBehavior: "contain", WebkitOverflowScrolling: "touch" }}>
            <DrawingCanvas key={pages[clampedIndex]?.id || clampedIndex} c={c} strokes={strokes} onAddStroke={handleAddStroke} tool={tool} color={color} penWidth={penWidth} pageHeight={2000} />
          </div>
        </>
      ) : (
        <textarea defaultValue={note.text || ""} onChange={(e) => handleTextChange(e.target.value)} placeholder={t.noteTextPlaceholder} className="memora-input"
          style={{ flex: 1, minHeight: 380, width: "100%", resize: "none", background: c.bgElevated, border: `1px solid ${c.border}`, borderRadius: 14, padding: 18, fontSize: 15, lineHeight: 1.7, color: c.ink }} />
      )}

      {confirmDelete && (
        <ConfirmModal c={c} title={t.confirmDeleteNoteTitle} body={t.confirmDeleteNoteBody} confirmLabel={t.confirmDeleteNoteBtn} cancelLabel={t.cancel}
          onCancel={() => setConfirmDelete(false)} onConfirm={onDelete} />
      )}
    </div>
  );
}

    </div>
  );
}

<script>
(function () {
  function showError(title, detail) {
    var el = document.getElementById("root");
    el.innerHTML =
      '<div style="min-height:100vh;background:#14152A;color:#EDEBF7;font-family:sans-serif;padding:28px;box-sizing:border-box;">' +
        '<h2 style="margin:0 0 12px;">' + title + '</h2>' +
        '<pre style="white-space:pre-wrap;word-break:break-word;background:#1C1E3A;padding:16px;border-radius:10px;font-size:13px;color:#E08277;line-height:1.5;">' +
          String(detail).replace(/</g, "&lt;") +
        '</pre>' +
        '<p style="color:#A6A4C6;font-size:13px;">このメッセージのスクリーンショットを送ってもらえれば原因を確認できます。</p>' +
      '</div>';
  }

  window.addEventListener("error", function (e) {
    if (document.getElementById("root") && !document.getElementById("root").hasChildNodes()) {
      showError("読み込み中にエラーが発生しました", e.message + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
    }
  });

  try {
    if (typeof Babel === "undefined") {
      showError("Babelの読み込みに失敗しました", "ネットワークがunpkg.comへのアクセスをブロックしている可能性があります。Wi-Fiを切ってモバイル回線で試すか、別のネットワークで試してください。");
      return;
    }
    var source = document.getElementById("app-source").textContent;
    var transformed = Babel.transform(source, { presets: ["react"] }).code;
    var script = document.createElement("script");
    script.text = transformed;
    document.body.appendChild(script);
  } catch (err) {
    showError("アプリのコードでエラーが発生しました (Babel変換エラー)", (err && err.message) || err);
  }
})();
</script>
</body>
</html>
