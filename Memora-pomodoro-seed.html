<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Memora</title>

<!-- PWA / iOS home-screen support -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#14152A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Memora" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />


<style>
  html, body { margin: 0; padding: 0; background: #14152A; }
  #root { min-height: 100vh; }
  * { box-sizing: border-box; }
  .memora-display { font-family: 'Fraunces', serif; }
  .memora-mono { font-family: 'IBM Plex Mono', monospace; }
  .memora-btn { cursor: pointer; border: none; transition: transform .12s ease, opacity .15s ease, background .15s ease; font-family: inherit; }
  .memora-btn:hover { transform: translateY(-1px); }
  .memora-btn:active { transform: translateY(0); }
  .memora-input { font-family: inherit; }
  .memora-fade { animation: memoraFade .35s ease; }
  @keyframes memoraFade { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }
  .memora-flip { animation: memoraFlip .4s ease; }
  @keyframes memoraFlip { from { opacity: 0; transform: rotateX(8deg) scale(.98);} to { opacity: 1; transform: rotateX(0) scale(1);} }
  @media (prefers-reduced-motion: reduce) { .memora-fade, .memora-flip { animation: none !important; } }
  .memora-scroll::-webkit-scrollbar { width: 8px; }
/* mg-growth-scene */
  .mg-sway { transform-origin: 0 0; animation: mgSway 6s ease-in-out infinite alternate; }
  @keyframes mgSway { from { transform: rotate(-1.1deg); } to { transform: rotate(1.1deg); } }
  .mg-stem, .mg-trunk, .mg-leaf { transform-origin: 0 0; }
  .mg-pop { transform-box: fill-box; transform-origin: center; }
  .mg-grow .mg-seed { animation: mgDrop 1s cubic-bezier(.3,.7,.3,1) both; }
  @keyframes mgDrop { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
  .mg-grow .mg-stem, .mg-grow .mg-trunk { animation: mgStem 1.6s cubic-bezier(.22,.8,.3,1) both; }
  @keyframes mgStem { from { transform: scaleY(.04); opacity: 0; } 15% { opacity: 1; } to { transform: scaleY(1); opacity: 1; } }
  .mg-grow .mg-leaf { animation: mgLeaf 1.2s cubic-bezier(.25,.9,.3,1.1) both; }
  @keyframes mgLeaf { from { transform: scale(0); opacity: 0; } 55% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
  .mg-grow .mg-pop { animation: mgPop 1.2s cubic-bezier(.25,.9,.3,1.08) both; }
  @keyframes mgPop { from { transform: scale(0); opacity: 0; } 55% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
  .mg-out { animation: mgOut .9s ease both; }
  @keyframes mgOut { to { opacity: 0; } }
  .mg-rays { transform-origin: 81px 19px; animation: mgRays 3.4s ease both; }
  @keyframes mgRays { 0% { opacity: 0; transform: rotate(-4deg); } 25% { opacity: 1; } 70% { opacity: .75; } 100% { opacity: 0; transform: rotate(3deg); } }
  .mg-mote { animation: mgMote 2.6s ease-out both; }
  @keyframes mgMote { 0% { opacity: 0; transform: translateY(0); } 25% { opacity: .95; } 100% { opacity: 0; transform: translateY(-34px); } }
  .mg-twinkle { transform-box: fill-box; transform-origin: center; animation: mgTwinkle 3.2s ease-in-out infinite; }
  @keyframes mgTwinkle { 0%, 100% { opacity: .45; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.12); } }
  .mg-drift { animation: mgDrift 16s ease-in-out infinite alternate; }
  @keyframes mgDrift { from { transform: translateX(0); } to { transform: translateX(16px); } }
  @media (prefers-reduced-motion: reduce) {
    .mg-sway, .mg-twinkle, .mg-drift, .mg-grow *, .mg-out { animation: none !important; }
    .mg-rays, .mg-mote { display: none; }
  }

/* mg-growth-scene */ end
</style>
</head>
<body>
<div id="root"></div>


<!-- React + the precompiled app are inlined: no CDN and no in-browser Babel, so it works offline and in restricted previews. -->
<script>
window.addEventListener("error", function (e) {
  var root = document.getElementById("root");
  if (root && !root.hasChildNodes()) {
    root.innerHTML = '<div style="min-height:100vh;background:#14152A;color:#EDEBF7;font-family:sans-serif;padding:28px;box-sizing:border-box;"><h2 style="margin:0 0 12px;">読み込み中にエラーが発生しました</h2><pre style="white-space:pre-wrap;word-break:break-word;background:#1C1E3A;padding:16px;border-radius:10px;font-size:13px;color:#E08277;line-height:1.5;">' + String(e.message).replace(/</g, "&lt;") + '</pre></div>';
  }
});
</script>
